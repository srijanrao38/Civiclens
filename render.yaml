
services:
  - type: web
    name: civiclens-backend
    runtime: python
    plan: free
    rootDir: CivicLens-Backend

    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input

    startCommand: python manage.py migrate --no-input && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT

    envVars:
      - key: PYTHON_VERSION
        value: 3.13.6

      - key: DEBUG
        value: "False"

      - key: SECRET_KEY
        generateValue: true

      - key: JWT_SIGNING_KEY
        generateValue: true

      - key: DATABASE_URL
        sync: false
